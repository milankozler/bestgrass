<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Děkujeme | BestGrass</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: left-aligned 1180px grid. Hero split text/photo with the photo bleeding right.
   Sections sit on paper; the rental section is set on sand (topdressing material),
   the smart-garden section on night (garden lighting). Three service colours:
   turf green, water blue, sand. */
:root{
  --paper:#F5F7F1; --card:#FFFFFF; --ink:#152619; --ink-2:#4B5A4F; --ink-3:#7A877E;
  --line:#D8DED3; --line-2:#C5CEC2;
  --turf:#1E7A3E; --turf-deep:#145A2D; --turf-tint:#E3F0E6; --turf-fg:#FFFFFF;
  --water:#2A6C99; --water-tint:#E2EDF5;
  --sand:#EEE5CE; --sand-deep:#7E6433; --sand-tint:#F8F3E7; --sand-line:#DACDAE;
  --night:#0F1A14; --night-2:#172620; --night-fg:#E9EFEA; --night-fg-2:#A9B8AE; --night-line:#28382F; --lamp:#F0C169;
  --ok:#1E7A3E; --err:#B23A2E;
  --font-display:"Bricolage Grotesque", "Instrument Sans", "Segoe UI", Arial, sans-serif;
  --font-body:"Instrument Sans", "Segoe UI", Arial, Helvetica, sans-serif;
  --radius:6px; --shadow:0 18px 40px -24px rgba(21,38,25,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1512; --card:#172019; --ink:#E8EEE9; --ink-2:#AAB6AD; --ink-3:#7F8B82;
    --line:#26312A; --line-2:#334038;
    --turf:#3FA463; --turf-deep:#7AD39A; --turf-tint:#17281D; --turf-fg:#0B1A10;
    --water:#6CAEDC; --water-tint:#14283A;
    --sand:#2B2518; --sand-deep:#DCBC77; --sand-tint:#1F1B12; --sand-line:#4A3F27;
    --night:#0A100C; --night-2:#121B15; --night-line:#243029;
    --shadow:0 18px 40px -24px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1512; --card:#172019; --ink:#E8EEE9; --ink-2:#AAB6AD; --ink-3:#7F8B82;
  --line:#26312A; --line-2:#334038;
  --turf:#3FA463; --turf-deep:#7AD39A; --turf-tint:#17281D; --turf-fg:#0B1A10;
  --water:#6CAEDC; --water-tint:#14283A;
  --sand:#2B2518; --sand-deep:#DCBC77; --sand-tint:#1F1B12; --sand-line:#4A3F27;
  --night:#0A100C; --night-2:#121B15; --night-line:#243029;
  --shadow:0 18px 40px -24px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:84px}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{transition:none!important; animation:none!important} }
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased}
img{max-width:100%; height:auto; display:block}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; text-wrap:balance; line-height:1.08; letter-spacing:-.015em}
h1{font-size:clamp(2.35rem, 5.2vw, 4.1rem); font-weight:700}
h2{font-size:clamp(1.85rem, 3.4vw, 2.7rem); font-weight:700}
h3{font-size:1.2rem; font-weight:650; line-height:1.25}
p{margin:0}
.lead{font-size:clamp(1.08rem, 1.6vw, 1.25rem); color:var(--ink-2); max-width:62ch; line-height:1.5}
.wrap{max-width:1180px; margin-inline:auto; padding-inline:clamp(16px, 4vw, 40px)}
.section{padding-block:clamp(60px, 8vw, 108px)}
.section-head{display:grid; gap:14px; max-width:760px; margin-bottom:clamp(32px, 5vw, 56px)}
.section-head .lead{max-width:none}
.tabular{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--turf); outline-offset:3px; border-radius:3px}
small{font-size:.85em; color:var(--ink-2)}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 20px; border-radius:var(--radius); font:600 1rem var(--font-body); text-decoration:none; cursor:pointer; border:1.5px solid transparent; transition:background .15s, color .15s, border-color .15s; white-space:nowrap}
.btn-primary{background:var(--turf); color:var(--turf-fg); border-color:var(--turf)}
.btn-primary:hover{background:var(--turf-deep); border-color:var(--turf-deep)}
.btn-secondary{background:transparent; color:var(--ink); border-color:var(--line-2)}
.btn-secondary:hover{border-color:var(--ink)}
.btn-ghost{background:transparent; color:var(--turf); border-color:var(--turf); padding:10px 16px; font-size:.95rem}
.btn-ghost:hover{background:var(--turf); color:var(--turf-fg)}
.btn-water{background:var(--water); color:#fff; border-color:var(--water)}
.btn-water:hover{filter:brightness(.92)}
.btn-sand{background:var(--sand-deep); color:#fff; border-color:var(--sand-deep)}
.btn-sand:hover{filter:brightness(.92)}
.btn[disabled]{opacity:.6; cursor:default}

/* header */
.site-header{position:sticky; top:env(safe-area-inset-top, 0px); z-index:50; background:color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter:saturate(1.4) blur(12px); border-bottom:1px solid var(--line)}
.site-header .wrap{display:flex; align-items:center; gap:28px; min-height:70px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; font-family:var(--font-display); font-weight:800; font-size:1.45rem; letter-spacing:-.02em; line-height:1}
.brand-mark{width:30px; height:30px; flex:none}
.brand small{display:block; font:500 .72rem var(--font-body); color:var(--ink-2); letter-spacing:.01em; margin-top:3px; white-space:nowrap}
@media (max-width: 480px){ .brand small{display:none} }
.nav{display:flex; gap:4px; margin-left:auto; align-items:center}
.nav a{padding:8px 11px; text-decoration:none; font-weight:500; font-size:.95rem; color:var(--ink-2); border-radius:4px; white-space:nowrap}
.nav a.btn-primary{color:var(--turf-fg); background:var(--turf); padding:11px 18px}
.nav a.btn-primary:hover{color:var(--turf-fg); background:var(--turf-deep)}
.nav a:hover{color:var(--ink); background:var(--turf-tint)}
.nav .btn{margin-left:10px}
.nav-toggle{display:none; margin-left:auto; background:none; border:1.5px solid var(--line-2); border-radius:var(--radius); padding:9px 12px; font:600 .95rem var(--font-body); color:var(--ink); cursor:pointer}
@media (max-width: 980px){
  .nav{display:none; position:absolute; left:0; right:0; top:100%; flex-direction:column; align-items:stretch; background:var(--card); border-bottom:1px solid var(--line); padding:12px clamp(16px,4vw,40px) 18px; gap:2px; box-shadow:var(--shadow)}
  .nav.open{display:flex}
  .nav a{padding:12px 10px; font-size:1.05rem}
  .nav .btn{margin:10px 0 0}
  .nav-toggle{display:inline-block}
}

/* hero */
.hero{overflow:hidden}
.hero .wrap{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:clamp(28px,5vw,64px); align-items:center; padding-block:clamp(40px,6vw,84px)}
.hero-copy{display:grid; gap:24px}
.hero-copy .lead{max-width:56ch}
.hero-actions{display:flex; flex-wrap:wrap; gap:12px; align-items:center}
.hero-phone{display:flex; gap:10px; align-items:baseline; color:var(--ink-2); font-size:.95rem; flex-wrap:wrap}
.hero-phone strong{color:var(--ink); font-family:var(--font-display); font-size:1.15rem; font-weight:600; letter-spacing:.01em}
.hero-photo{position:relative; margin-right:calc(-1 * clamp(16px, 4vw, 40px))}
.hero-photo img{width:100%; height:clamp(320px, 46vw, 600px); object-fit:cover; object-position:50% 45%; border-radius:var(--radius) 0 0 var(--radius)}
.hero-photo figcaption{position:absolute; left:14px; bottom:14px; background:color-mix(in srgb, var(--card) 92%, transparent); color:var(--ink); padding:8px 12px; border-radius:4px; font-size:.85rem; font-weight:500; box-shadow:var(--shadow)}
@media (max-width: 860px){
  .hero .wrap{grid-template-columns:1fr}
  .hero-photo{margin-inline:calc(-1 * clamp(16px, 4vw, 40px)); order:-1}
  .hero-photo img{height:clamp(240px, 56vw, 420px); border-radius:0}
}
.facts{border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--card)}
.facts .wrap{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:0}
.fact{padding:20px 22px 20px 0; display:grid; gap:4px; border-left:1px solid var(--line); padding-left:22px}
.fact:first-child{border-left:0; padding-left:0}
.fact strong{font-family:var(--font-display); font-size:1.08rem; font-weight:650; line-height:1.2}
.fact span{color:var(--ink-2); font-size:.92rem; line-height:1.4}
@media (max-width: 860px){
  .facts .wrap{grid-template-columns:1fr 1fr}
  .fact{border-left:0; padding-left:0; border-top:1px solid var(--line)}
  .fact:nth-child(-n+2){border-top:0}
}
@media (max-width: 480px){ .facts .wrap{grid-template-columns:1fr} .fact:nth-child(2){border-top:1px solid var(--line)} }

/* services list */
.svc-grid{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:clamp(28px,5vw,64px); align-items:start}
.svc-list{display:grid; border-top:1px solid var(--line)}
.svc{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 24px; padding:18px 0; border-bottom:1px solid var(--line); align-items:baseline}
.svc h3{font-size:1.1rem; font-weight:650}
.svc p{grid-column:1; color:var(--ink-2); font-size:.95rem; max-width:56ch}
.svc .price{grid-column:2; grid-row:1 / span 2; text-align:right; font-family:var(--font-display); font-weight:650; font-size:1.05rem; white-space:nowrap; color:var(--turf-deep)}
.svc .price small{display:block; font:400 .8rem var(--font-body); color:var(--ink-2); white-space:normal; max-width:14ch; margin-left:auto}
@media (max-width: 560px){ .svc{grid-template-columns:1fr} .svc .price{grid-column:1; grid-row:auto; text-align:left} .svc .price small{margin-left:0; max-width:none} }
.svc-aside{display:grid; grid-template-columns:minmax(0,1fr); gap:22px; position:sticky; top:96px; min-width:0}
.svc-aside img{border-radius:var(--radius); width:100%; aspect-ratio:4/3; object-fit:cover}
.note{background:var(--turf-tint); border-left:3px solid var(--turf); padding:14px 16px; border-radius:0 var(--radius) var(--radius) 0; font-size:.95rem; color:var(--ink)}
.note strong{font-family:var(--font-display)}
@media (max-width: 860px){ .svc-grid{grid-template-columns:1fr} .svc-aside{position:static} }

/* process steps (a real sequence) */
.steps{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:18px; counter-reset:step; margin-top:clamp(40px,6vw,64px)}
.step{counter-increment:step; display:grid; gap:8px; padding-top:16px; border-top:2px solid var(--line-2); position:relative}
.step::before{content:counter(step); font-family:var(--font-display); font-weight:700; font-size:.9rem; color:var(--turf); position:absolute; top:-13px; left:0; background:var(--paper); padding-right:8px}
.step h3{font-size:1.05rem}
.step p{color:var(--ink-2); font-size:.93rem}
.steps.four{grid-template-columns:repeat(4, minmax(0,1fr))}
.steps.three{grid-template-columns:repeat(3, minmax(0,1fr))}
.steps.water .step::before{color:var(--water)}
.steps.sand .step::before{color:var(--sand-deep); background:var(--sand-tint)}
@media (max-width: 900px){ .steps, .steps.four{grid-template-columns:repeat(2, minmax(0,1fr))} }
@media (max-width: 520px){ .steps, .steps.four, .steps.three{grid-template-columns:1fr} }

/* season calendar */
.season{margin-top:clamp(40px,6vw,64px); display:grid; gap:14px}
.season-head{display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap}
.season-head p{color:var(--ink-2); font-size:.92rem}
.season-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
.season-grid{display:grid; grid-template-columns:minmax(150px, 190px) repeat(9, minmax(52px,1fr)); min-width:640px; border:1px solid var(--line); border-radius:var(--radius); background:var(--card); overflow:hidden}
.season-grid > div{padding:10px 8px; border-bottom:1px solid var(--line); font-size:.9rem; display:flex; align-items:center}
.season-grid .m{justify-content:center; font-family:var(--font-display); font-weight:600; color:var(--ink-2); background:var(--paper)}
.season-grid .m.on{color:var(--ink)}
.season-grid .l{font-weight:500; padding-left:14px}
.season-grid .c{justify-content:center}
.season-grid .c i{width:14px; height:14px; border-radius:50%; background:var(--turf); display:block}
.season-grid .c i.half{background:transparent; border:2px solid var(--turf)}
.season-grid .c i.w{background:var(--water)}
.season-grid > div:nth-last-child(-n+10){border-bottom:0}
.season-legend{display:flex; gap:18px; flex-wrap:wrap; color:var(--ink-2); font-size:.88rem}
.season-legend i{display:inline-block; width:12px; height:12px; border-radius:50%; vertical-align:-1px; margin-right:6px; background:var(--turf)}
.season-legend i.half{background:transparent; border:2px solid var(--turf)}
.season-legend i.w{background:var(--water)}

/* forms */
.hp{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}
.form-block{margin-top:clamp(40px,6vw,64px); background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:clamp(20px,3.5vw,40px); box-shadow:var(--shadow)}
.form-block.water{border-top:4px solid var(--water)}
.form-block.turf{border-top:4px solid var(--turf)}
.form-block.sand{border-top:4px solid var(--sand-deep)}
.form-head{display:grid; gap:8px; margin-bottom:24px; max-width:60ch}
.form-head p{color:var(--ink-2)}
.form{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:18px 20px}
.form .full{grid-column:1 / -1}
.field{display:grid; gap:6px; min-width:0}
.field label, .field .lbl{font-weight:600; font-size:.92rem}
.field label span, .field .lbl span{font-weight:400; color:var(--ink-3)}
.field input:not([type=checkbox]):not([type=radio]):not([type=file]), .field select, .field textarea{width:100%; font:inherit; font-size:1rem; padding:11px 12px; border:1.5px solid var(--line-2); border-radius:var(--radius); background:var(--paper); color:var(--ink); min-width:0}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--turf); box-shadow:0 0 0 3px color-mix(in srgb, var(--turf) 22%, transparent)}
.field textarea{min-height:110px; resize:vertical}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{position:relative}
.chip input{position:absolute; inset:0; opacity:0; width:100%; height:100%; margin:0; cursor:pointer}
.chip span{display:inline-block; padding:8px 13px; border:1.5px solid var(--line-2); border-radius:999px; font-size:.92rem; background:var(--paper); cursor:pointer; user-select:none}
.chip input:checked + span{background:var(--turf); color:var(--turf-fg); border-color:var(--turf)}
.chip input:focus-visible + span{outline:3px solid var(--turf); outline-offset:2px}
.radios{display:flex; flex-wrap:wrap; gap:8px 18px}
.radios label{display:inline-flex; gap:8px; align-items:center; font-weight:400; font-size:.98rem; cursor:pointer}
.radios input{width:18px; height:18px; accent-color:var(--turf); margin:0}
.check{display:flex; gap:10px; align-items:flex-start; font-size:.92rem; color:var(--ink-2)}
.check input{width:18px; height:18px; accent-color:var(--turf); margin:2px 0 0; flex:none}
.file{border:1.5px dashed var(--line-2); border-radius:var(--radius); padding:14px; background:var(--paper); display:grid; gap:10px}
.file input{font-size:.92rem}
.file-hint{font-size:.86rem; color:var(--ink-2)}
.thumbs{display:flex; gap:8px; flex-wrap:wrap}
.thumbs img{width:72px; height:72px; object-fit:cover; border-radius:4px; border:1px solid var(--line)}
.form-foot{grid-column:1/-1; display:flex; gap:16px; align-items:center; flex-wrap:wrap; justify-content:space-between; margin-top:6px}
.form-foot p{color:var(--ink-2); font-size:.9rem}
.form-msg{grid-column:1/-1; font-size:.95rem; padding:12px 14px; border-radius:var(--radius)}
.form-msg.err{background:color-mix(in srgb, var(--err) 12%, var(--card)); color:var(--err)}
.success{display:grid; gap:12px; padding:8px 0}
.success h3{font-size:1.5rem}
.success p{color:var(--ink-2); max-width:60ch}
.success .btn{justify-self:start; margin-top:6px}
.estimate{grid-column:1/-1; background:var(--sand-tint); border:1px solid var(--sand-line); border-radius:var(--radius); padding:14px 16px; display:grid; gap:4px; font-size:.95rem}
.estimate strong{font-family:var(--font-display); font-size:1.25rem; color:var(--sand-deep)}
@media (max-width: 640px){ .form{grid-template-columns:1fr} }

/* irrigation */
.section.water-bg{background:var(--card); border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.two-col{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:clamp(28px,5vw,64px); align-items:center}
.two-col img{border-radius:var(--radius); width:100%; aspect-ratio:4/3; object-fit:cover}
.points{display:grid; gap:16px; list-style:none; padding:0; margin:0}
.points li{display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:start}
.points li svg{width:26px; height:26px; flex:none; margin-top:2px}
.points li strong{display:block; font-family:var(--font-display); font-weight:650; font-size:1.05rem; margin-bottom:2px}
.points li span{color:var(--ink-2); font-size:.95rem}
.checklist{background:var(--water-tint); border-radius:var(--radius); padding:20px 22px; display:grid; gap:10px}
.checklist h3{font-size:1.05rem}
.checklist ul{margin:0; padding-left:0; list-style:none; display:grid; gap:8px; font-size:.95rem}
.checklist li{display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:start}
.checklist li::before{content:""; width:9px; height:9px; border-radius:50%; background:var(--water); margin-top:8px}
.photo-pair{display:grid; grid-template-columns:minmax(0,1fr); gap:14px}
.photo-pair img{border-radius:var(--radius); width:100%; aspect-ratio:4/3; object-fit:cover}
.photo-pair img + img{aspect-ratio:16/7}
@media (max-width: 860px){ .two-col{grid-template-columns:1fr} }

/* rental */
.section.sand-bg{background:var(--sand-tint); border-top:1px solid var(--sand-line); border-bottom:1px solid var(--sand-line)}
.rent-intro{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:clamp(28px,5vw,64px); align-items:center; margin-bottom:clamp(32px,5vw,56px)}
.rent-intro img{border-radius:var(--radius); width:100%; aspect-ratio:4/3; object-fit:cover}
.rules{display:grid; gap:10px; list-style:none; padding:0; margin:0; font-size:.95rem}
.rules li{display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:start; color:var(--ink-2)}
.rules li::before{content:""; width:9px; height:9px; border-radius:50%; background:var(--sand-deep); margin-top:8px}
.rules li strong{color:var(--ink)}
@media (max-width: 860px){ .rent-intro{grid-template-columns:1fr} }
.filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px}
.filters button{font:600 .92rem var(--font-body); padding:8px 14px; border-radius:999px; border:1.5px solid var(--sand-line); background:var(--card); color:var(--ink); cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--sand-deep); color:#fff; border-color:var(--sand-deep)}
.rc-grid{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px}
.rc{background:var(--card); border:1px solid var(--sand-line); border-radius:var(--radius); display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto 1fr; overflow:hidden; min-width:0}
.rc[hidden]{display:none}
.rc-img{background:#fff; aspect-ratio:4/3; display:grid; place-items:center; padding:12px; border-bottom:1px solid var(--sand-line); min-width:0; overflow:hidden}
.rc-img img{width:100%; height:100%; object-fit:contain}
.rc-body{padding:14px 16px 16px; display:grid; gap:6px; align-content:start; min-width:0}
.rc-body h3{font-size:1.02rem}
.rc-body p{font-size:.88rem; color:var(--ink-2); min-height:2.6em}
.rc-price{display:flex; gap:6px; align-items:baseline; margin-top:4px}
.rc-price strong{font-family:var(--font-display); font-size:1.35rem; font-weight:700; font-variant-numeric:tabular-nums}
.rc-price span{color:var(--ink-2); font-size:.88rem}
.rc-meta{display:grid; gap:2px; font-size:.85rem; color:var(--ink-2); font-variant-numeric:tabular-nums}

/* references */
.ref-grid{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:18px}

@media (max-width: 560px){ .ref-grid{grid-template-columns:1fr} }

/* gallery */
.gal{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); grid-auto-rows:220px; grid-auto-flow:dense; gap:12px}
.gal-item{margin:0; position:relative; overflow:hidden; border-radius:var(--radius); background:var(--card)}

.gal-item.tall{grid-row:span 2}
.gal-item figcaption{position:absolute; left:0; right:0; bottom:0; padding:28px 12px 10px; font-size:.82rem; color:#fff; background:linear-gradient(to top, rgba(10,20,12,.78), rgba(10,20,12,0)); line-height:1.3}

/* pricing */
.price-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:clamp(24px,4vw,40px)}
.price-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:clamp(18px,3vw,28px); display:grid; gap:14px; align-content:start; min-width:0}

.bands{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:.95rem}
.bands th{text-align:left; font-weight:600; font-size:.82rem; color:var(--ink-3); padding:0 0 8px; border-bottom:1px solid var(--line)}
